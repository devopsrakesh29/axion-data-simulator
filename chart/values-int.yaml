environment: int

replicaCount: 1

image:
  repository: rakeshacr01.azurecr.io/int-axion-data-simulator
  pullPolicy: Always
  tag: "int-latest"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: kong
  hosts:
    - host: int-simulator.axion.local
      paths:
        - path: /
          pathType: Prefix

env:
  API_URL: "http://axion-ingestion-service.default.svc.cluster.local:8000/api/v1/telemetry/ingest"
  INTERVAL_SECONDS: "5"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
